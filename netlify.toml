[build]
  base = "frontend"
  command = "npm ci --include=dev && npm ci --prefix ../backend --omit=dev && npm run build"
  publish = "dist"
  functions = "../backend/netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
